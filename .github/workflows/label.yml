name: Labeler

on:
  - pull_request_target

jobs:
  label:
    runs-on: ubuntu-latest
    # The default token is read-only in this repo; adding labels needs write
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@v2
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
